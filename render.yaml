services:
  - type: web
    name: mediahub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn url:app --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: YourStrongPassword123!
      - key: DATABASE_URL
        fromDatabase:
          name: mediahub-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: mediahub-db
    plan: free
    databaseName: mediagallery